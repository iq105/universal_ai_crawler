# 可选：有 Docker 时一键启动 PostgreSQL + Redis
# 无 Docker 时可直接使用默认 SQLite 配置，无需本文件
services:
  postgres:
    image: postgres:16
    container_name: uc-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: universal_crawler
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: uc-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
